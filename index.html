:root{--red:#741016;--deep:#350608;--gold:#d5a63c;--cream:#fff8e8;--ink:#46100f}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Microsoft JhengHei","Noto Serif TC",serif;background:radial-gradient(circle at top,#a9272d 0,#700c12 38%,#310507 100%);color:var(--ink);padding:14px}.page{width:min(100%,620px);margin:auto}.orn{text-align:center;color:#f3d681;letter-spacing:8px;margin:8px 0 12px}.card{background:linear-gradient(145deg,#fffdf6,#f7e5bc);border:2px solid var(--gold);border-radius:24px;padding:28px 24px;box-shadow:0 18px 45px #16000080,inset 0 0 0 4px #fff9e7;position:relative;overflow:hidden}.card:before,.card:after{content:"◆";position:absolute;color:#c6922d;font-size:26px}.card:before{top:9px;left:12px}.card:after{right:12px;bottom:9px}h1{text-align:center;color:#5b0b0f;font-size:34px;letter-spacing:7px;margin:3px 0 8px}.sub{text-align:center;color:#87612d;font-size:14px;margin:0 0 23px}.inputbox{background:linear-gradient(145deg,#86151b,#650b10);border:1px solid #ebc86e;border-radius:17px;padding:18px;box-shadow:inset 0 0 16px #3a000040}.inputbox label{display:block;text-align:center;color:#ffe8a2;font-weight:700;margin-bottom:11px}.inputrow{display:flex;gap:10px}input{width:100%;min-width:0;border:2px solid #d7aa45;border-radius:12px;background:#fffdf3;color:#4a1010;padding:14px;text-align:center;font-size:22px;outline:none}input:focus{box-shadow:0 0 0 3px #f1d47c66}button{border:1px solid #f5d77c;border-radius:12px;background:linear-gradient(#edc95f,#b97f1e);color:#471008;font-size:18px;font-weight:900;padding:0 22px;min-height:54px;cursor:pointer;box-shadow:0 4px 0 #70420e}button:active{transform:translateY(2px);box-shadow:0 2px 0 #70420e}.error{text-align:center;color:#a3161b;font-weight:700;min-height:30px;padding-top:8px}.gz{text-align:center;color:#760e13;font-size:36px;font-weight:900;letter-spacing:3px;padding:9px;margin:7px 0 17px;background:linear-gradient(90deg,transparent,#e9c65a55,transparent)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.item{text-align:center;background:#fff9e9;border:1px solid #dab75e;border-radius:14px;padding:14px 8px;box-shadow:inset 0 0 12px #cc9c2f20}.label{font-size:13px;color:#89632f}.value{font-size:23px;font-weight:900;color:#591014;margin-top:4px}.foot{text-align:center;color:#efd483;font-size:12px;margin:17px 0 3px}@media(max-width:520px){body{padding:10px}.orn{margin:2px 0 8px}.card{border-radius:19px;padding:22px 13px}h1{font-size:29px;letter-spacing:5px}.sub{font-size:13px;margin-bottom:17px}.inputbox{padding:15px 12px}.inputrow{flex-direction:column}input{font-size:21px;min-height:53px}button{width:100%;font-size:19px}.gz{font-size:31px}.grid{gap:8px}.item{padding:12px 6px}.value{font-size:21px}}

<body><main class="page"><div class="orn">◇ ◆ ◇</div><section class="card"><h1>干支速查</h1><p class="sub">西元年份・六十甲子對照查詢</p><div class="inputbox"><label for="year">請輸入出生西元年份</label><div class="inputrow"><input id="year" type="number" inputmode="numeric" placeholder="例如：2005"><button onclick="lookup()">立即查詢</button></div></div><div id="error" class="error"></div><div id="result" hidden><div id="gz" class="gz"></div><div class="grid"><div class="item"><div class="label">生肖</div><div id="zodiac" class="value"></div></div><div class="item"><div class="label">庫</div><div id="ku" class="value"></div></div><div class="item"><div class="label">曹官</div><div id="officer" class="value"></div></div><div class="item"><div class="label">欠錢</div><div id="debt" class="value"></div></div></div></div></section><div class="foot">六十甲子循環查詢</div></main>

const data=Object.fromEntries(rows.map(r=>[r[0],r.slice(1)]));const stems=[...'甲乙丙丁戊己庚辛壬癸'];const branches=[...'子丑寅卯辰巳午未申酉戌亥'];function mod(n,m){return((n%m)+m)%m}function lookup(){const y=Number(document.getElementById('year').value),err=document.getElementById('error'),res=document.getElementById('result');if(!Number.isInteger(y)||y<1){err.textContent='請輸入有效的西元年份';res.hidden=true;return}const o=y-1984,g=stems[mod(o,10)]+branches[mod(o,12)],r=data[g];err.textContent='';document.getElementById('gz').textContent=y+' 年・'+g;['zodiac','ku','officer','debt'].forEach((id,i)=>document.getElementById(id).textContent=r[i]);res.hidden=false}document.getElementById('year').addEventListener('keydown',e=>{if(e.key==='Enter')lookup()});
</script></body></html>
